content:
  - name: personal
    label: Personal
    type: collection
    path: content/personal
    format: json
    filename: "{fields.order}-{primary}.json"
    view:
      primary: title
      sort: [order, title]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: text
        label: Description
        type: text
        required: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: link
        label: Link
        type: string
        pattern: "^https?://"
        description: Optional — full URL, e.g. https://athena.motionukict.com
      - name: order
        label: Order
        type: number
        required: true

